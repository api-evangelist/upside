aid: upside
name: Upside
description: 'Upside is a two-sided commerce platform that connects brick-and-mortar
  retailers with consumers through personalized cash-back offers on everyday purchases
  like fuel, groceries, and dining. More than 5 million users have earned over $1B
  in cash back through its app, while retailers use the Upside Marketplace, Measurement,
  and Loyalty+ products to drive proven incremental profit. For technology partners,
  Upside offers a partner-gated, enterprise-ready API that delivers personalized,
  evergreen offers inside partner apps, though it publishes no public developer portal
  or self-serve API documentation.'
